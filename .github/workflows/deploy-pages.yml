name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh baked CJA gold rates on GitHub Pages daily (IST morning ~9:30).
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Bake live CJA rates into public/gold-rates.json for static Pages.
      - name: Fetch CJA gold rates
        run: npm run fetch-gold-rates

      # Static export cannot include dynamic API routes (SMTP / Razorpay).
      # Admin stays in the build and runs in the browser for client testing.
      - name: Remove server API for static export
        run: |
          rm -rf src/app/api
          rm -f src/proxy.ts

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_GITHUB_PAGES: "true"
          NEXT_PUBLIC_ADMIN_PASSWORD: aura-demo

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
